<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hockey Canada coach card presented in the Hockey Canada High Performance 1 page theme.">
    <title>Hockey Canada Coach Card Template</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #0A2463;
            --navy-dark: #071B4A;
            --teal: #3E8E7E;
            --teal-dark: #2F6B5F;
            --orange: #F4A261;
            --page: #FDFDFD;
            --surface: #FFFFFF;
            --surface-soft: #F1F5F9;
            --text: #1E293B;
            --font-main: 'Inter', sans-serif;
            --shadow-lg: 0 14px 32px rgba(15, 23, 42, 0.11);
            --radius-lg: 1rem;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background: var(--page);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--page);
            color: var(--text);
            font-family: var(--font-main);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a:focus-visible {
            outline: 3px solid rgba(62, 142, 126, 0.5);
            outline-offset: 3px;
            border-radius: 0.375rem;
        }

        .page-shell {
            width: 100%;
            max-width: none;
            margin: 0;
            background: transparent;
        }

        .header-main {
            position: relative;
            overflow: hidden;
            padding: 2rem 10rem 1.8rem;
            background: var(--navy);
            color: #FFFFFF;
            text-align: center;
            box-shadow: 0 4px 14px rgba(10, 36, 99, 0.18);
        }

        .header-main::after {
            content: '';
            position: absolute;
            right: -6rem;
            bottom: -8rem;
            width: 18rem;
            height: 18rem;
            border: 2.5rem solid rgba(62, 142, 126, 0.14);
            border-radius: 50%;
            pointer-events: none;
        }

        .eyebrow {
            position: relative;
            z-index: 1;
            margin: 0 0 0.35rem;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.105em;
            text-transform: uppercase;
            opacity: 0.88;
        }

        h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            font-size: clamp(1.85rem, 4vw, 2.65rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.025em;
        }

        .home-button {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            max-width: 9.5rem;
            padding: 0.58rem 0.9rem;
            border-radius: 0.5rem;
            background: var(--teal);
            color: #FFFFFF;
            font-size: 0.83rem;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            text-decoration: none;
            transform: translateY(-50%);
            transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .home-button:hover {
            background: var(--teal-dark);
            color: #FFFFFF;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
            transform: translateY(calc(-50% - 1px));
        }

        .site-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: center;
            gap: 0.25rem;
            padding: 0.7rem 1rem;
            background: var(--navy-dark);
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.13);
        }

        .site-nav a {
            padding: 0.52rem 0.82rem;
            border-radius: 0.375rem;
            color: #FFFFFF;
            font-size: 0.86rem;
            font-weight: 500;
            line-height: 1.25;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .site-nav a:hover,
        .site-nav a:focus-visible {
            background: var(--teal);
            color: #FFFFFF;
        }

        main {
            width: 100%;
            padding: 0;
            background: var(--page);
        }

        .coach-card-stack {
            display: grid;
            gap: 0;
            width: 100%;
            margin: 0;
        }

        .coach-card-page {
            width: 100%;
            margin: 0;
            overflow: hidden;
            border-radius: 0;
            background: var(--surface);
            box-shadow: none;
            scroll-margin-top: 5rem;
        }

        .coach-card-page + .coach-card-page {
            border-top: 4px solid var(--teal);
        }

        .coach-card-page img {
            display: block;
            width: 100%;
            height: auto;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .footer-main {
            padding: 1.35rem 1rem;
            background: var(--navy);
            color: #FFFFFF;
            text-align: center;
            font-size: 0.86rem;
        }

        .footer-main p {
            margin: 0;
            opacity: 0.9;
        }

        .footer-accent {
            height: 4px;
            background: linear-gradient(90deg, var(--teal), var(--orange));
        }

        @media (max-width: 768px) {
            .header-main {
                padding: 1.35rem 1rem 1.5rem;
            }

            .home-button {
                position: relative;
                top: auto;
                left: auto;
                margin-bottom: 0.9rem;
                transform: none;
            }

            .home-button:hover {
                transform: translateY(-1px);
            }

            .site-nav {
                justify-content: flex-start;
                overflow-x: auto;
                scrollbar-width: thin;
            }

            .site-nav a {
                flex: 0 0 auto;
                white-space: nowrap;
            }
        }

        @media (max-width: 520px) {
            .site-nav {
                padding-inline: 0.55rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        @media print {
            @page {
                size: landscape;
                margin: 0;
            }

            .header-main,
            .site-nav,
            .footer-main,
            .footer-accent {
                display: none !important;
            }

            body,
            main,
            .page-shell,
            .coach-card-stack {
                margin: 0;
                padding: 0;
                background: #FFFFFF;
            }

            .coach-card-stack {
                display: block;
            }

            .coach-card-page {
                width: 100%;
                margin: 0;
                border: 0;
                border-radius: 0;
                box-shadow: none;
                break-after: page;
                page-break-after: always;
            }

            .coach-card-page:last-child {
                break-after: auto;
                page-break-after: auto;
            }
        }
    </style>
</head>
